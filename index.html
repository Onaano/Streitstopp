<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streit-Stopp – Konflikte erkennen &amp; Lösungen finden</title>
<style>
:root{--bg:#f8f0e1;--paper:#fffaf0;--ink:#3d2f28;--ink2:#6b5a4f;--line:#e2d3bb;--teal:#2f6a72;--tealL:#dcecec;--terra:#c9764a;--terraL:#f8e1d3;--green:#3f7f55;--greenL:#dcefdf;--plum:#8c5a86;--plumL:#efe0ee;--sun:#e9b949;--sunL:#fbefc9;--red:#b8453a;--redL:#f6dcd7;--blue:#3d6fa3;--blueL:#dce8f4;--shadow:0 3px 0 rgba(90,64,51,.12),0 8px 18px rgba(90,64,51,.12);--r:20px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:clamp(16px,1.05vw + 11px,22px);line-height:1.4;overflow-x:hidden;min-height:100vh;background-image:radial-gradient(circle at 12% 8%,rgba(233,185,73,.16),transparent 38%),radial-gradient(circle at 92% 90%,rgba(201,118,74,.13),transparent 40%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid #1d4e8f;outline-offset:3px;border-radius:12px}
[hidden]{display:none!important}
#app{max-width:1280px;margin:0 auto;padding:12px 16px 40px;width:100%}
.screen{width:100%}
h1,h2,h3,p{margin:0}
.ico{width:1.3em;height:1.3em;display:block;flex:none}
/* ---- Kopf ---- */
.topline{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.iconbtn{display:inline-flex;align-items:center;gap:8px;min-height:48px;min-width:48px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper);box-shadow:0 2px 0 rgba(90,64,51,.1);font-weight:700;justify-content:center}
.iconbtn:hover{border-color:var(--teal)}
.iconbtn .ico{width:24px;height:24px}
body.nospeech .spk,body.mute .spk{display:none!important}
body.nospeech #sndBtn{display:none}
/* ---- Start ---- */
.hero{text-align:center;padding:10px 0 4px}
.hero h1{font-size:clamp(2.1rem,6vw,3.7rem);letter-spacing:.5px;line-height:1.05;color:var(--teal);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.hero h1 .ico{width:1.1em;height:1.1em}
.hero .sub{font-size:clamp(1.1rem,2.6vw,1.6rem);font-weight:700;color:var(--terra);margin-top:6px}
.hero .intro{font-size:clamp(1rem,2vw,1.25rem);color:var(--ink2);margin:10px auto 0;max-width:34em}
.steps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.step{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-weight:800;letter-spacing:.5px;font-size:.95rem}
.step svg{width:34px;height:34px;flex:none}
.step small{display:block;font-weight:600;letter-spacing:0;color:var(--ink2);font-size:.72em;line-height:1.1}
.step.on{border-color:var(--teal);background:var(--tealL)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;margin:18px 0}
.mcard{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:var(--r);background:var(--paper);border:3px solid var(--acc);box-shadow:var(--shadow);overflow:hidden;padding:0;transition:transform .15s}
.mcard:hover{transform:translateY(-3px)}
.mcard .art{background:var(--accL);border-bottom:3px solid var(--acc);display:block;line-height:0}
.mcard .art svg{width:100%;height:auto;display:block}
.mcard .txt{padding:12px 16px 16px;display:block}
.mcard .nm{font-size:1.35em;font-weight:900;color:var(--acc);letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.mcard .nm svg{width:30px;height:30px}
.mcard .ds{display:block;color:var(--ink);margin-top:4px;font-size:1em}
.mcard .go{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--acc);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800}
.mcard .go .ico{width:20px;height:20px}
.a-check{--acc:#2f6a72;--accL:#dcecec}.a-regler{--acc:#b8582e;--accL:#f8e1d3}.a-loesung{--acc:#3a7a50;--accL:#dcefdf}.a-sag{--acc:#7c4a77;--accL:#efe0ee}
.startfoot{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.bigbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:10px 26px;border-radius:999px;border:3px solid var(--teal);background:var(--teal);color:#fff;font-weight:900;font-size:1.1em;box-shadow:0 4px 0 rgba(47,106,114,.35)}
.bigbtn:hover{filter:brightness(1.07)}
.bigbtn:disabled{background:#c9bfae;border-color:#c9bfae;box-shadow:none;color:#fff;cursor:not-allowed}
.bigbtn.alt{background:var(--paper);color:var(--teal)}
.bigbtn .ico{width:24px;height:24px}
/* ---- Spielkopf ---- */
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.gbar .steps{margin:0;gap:6px;flex:1;justify-content:center}
.gbar .step{padding:3px 12px 3px 4px;font-size:.82rem;opacity:.75}
.gbar .step svg{width:30px;height:30px}
.gbar .step.on{opacity:1}
.prog{font-weight:900;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:130px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--teal);background:transparent;display:block}
.dots i.d{background:var(--teal)}.dots i.c{background:var(--sun);border-color:var(--terra)}
.stage{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media(min-width:1000px){.stage{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.stage .scene{position:sticky;top:12px}}
.scene{border-radius:var(--r);overflow:hidden;border:3px solid var(--line);box-shadow:var(--shadow);background:var(--paper)}
.bubrow{display:grid;gap:6px;padding:10px 8px 0;align-items:end;min-height:12px}
.bcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bub{position:relative;max-width:100%;background:#fff;border:3px solid #5a4033;border-radius:18px;padding:6px 12px;font-weight:700;font-size:clamp(.82rem,1.7vw,1.1rem);line-height:1.2;text-align:center;overflow-wrap:anywhere;hyphens:auto;margin-bottom:12px}
.bub::after{content:"";position:absolute;left:50%;bottom:-13px;width:16px;height:16px;background:inherit;border-right:3px solid #5a4033;border-bottom:3px solid #5a4033;transform:translateX(-50%) rotate(45deg) skew(8deg,8deg);border-bottom-right-radius:4px}
.bub.shout{font-weight:900;border-width:4px;text-transform:none;letter-spacing:.2px}
.bub.act{font-style:italic;font-weight:600;background:#f5ead6;border-style:dashed}
.bub.react{background:var(--sunL)}
.bub.mine{background:var(--greenL);animation:pop .45s ease}
.bub.mine.warn{background:var(--redL)}.bub.mine.alt{background:var(--tealL)}.bub.mine.help{background:var(--blueL)}
.bub.old{opacity:.0;transform:scale(.7);transition:all .3s}
.scene .scn{display:block;width:100%;height:auto;max-height:68vh}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
/* ---- Panel ---- */
.panel{background:var(--paper);border:3px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px 16px;min-width:0}
.situ{display:flex;gap:10px;align-items:flex-start;font-size:1.08em;font-weight:700}
.situ span{flex:1}
.q{font-size:1.2em;font-weight:900;color:var(--acc,var(--teal));margin:10px 0 8px}
.spk{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--teal);background:#fff;color:var(--teal);display:inline-flex;align-items:center;justify-content:center;padding:0}
.spk .ico{width:24px;height:24px}
.spk.mini{width:38px;height:38px}
.spk:hover{background:var(--tealL)}
.work{display:flex;flex-direction:column;gap:10px}
.fb{margin-top:12px;border-radius:16px;padding:10px 14px;background:var(--sunL);border:2px solid var(--sun);font-weight:600}
.fb:empty{display:none}
.fb b{display:block;font-size:1.05em;margin-bottom:2px}
.fb .hl{display:flex;gap:8px;align-items:flex-start;margin-top:6px;background:var(--blueL);border:2px solid var(--blue);border-radius:12px;padding:6px 10px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
/* ---- Check ---- */
.pool{display:flex;flex-direction:column;gap:8px}
.cardw{position:relative;display:flex;gap:6px;align-items:stretch}
.stm{flex:1;text-align:left;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;font-weight:600;min-height:52px;display:flex;align-items:center;gap:10px}
.stm:hover{border-color:var(--teal)}
.stm[aria-pressed=true]{border-color:var(--teal);background:var(--tealL);box-shadow:0 0 0 3px rgba(47,106,114,.25);transform:translateX(4px)}
.cardw .spk{align-self:center}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
@media(max-width:560px){.zones{grid-template-columns:1fr}}
.zone{border-radius:16px;border:3px dashed var(--acc);background:var(--accL);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.zone.know{--acc:#3a7a50;--accL:#e8f4ea}.zone.guess{--acc:#b8582e;--accL:#fbeee3}
.zhead{width:100%;text-align:left;border:0;background:transparent;padding:4px 4px 6px;font-weight:900;color:var(--acc);display:flex;gap:8px;align-items:flex-start;line-height:1.15;border-radius:10px}
.zhead small{display:block;font-weight:600;color:var(--ink2);font-size:.78em;margin-top:2px}
.zhead svg{width:30px;height:30px;flex:none}
.zone.target .zhead{background:rgba(255,255,255,.7);box-shadow:0 0 0 3px var(--acc)}
.placed{display:flex;flex-direction:column;gap:6px}
.stm.placed{background:#fff;border-color:var(--acc);font-size:.95em;width:100%}
.stm.ok{border-color:var(--green);background:var(--greenL)}
.stm.moved{border-color:var(--sun);background:var(--sunL)}
.stm .why{display:block;font-weight:500;font-size:.88em;color:var(--ink2);margin-top:2px}
.mk{width:26px;height:26px;flex:none}
/* ---- Regler ---- */
.gauge{width:100%;max-width:440px;margin:0 auto}
.gauge svg{width:100%;height:auto;display:block;overflow:visible}
.needle{transform-origin:150px 150px;transition:transform 1.1s cubic-bezier(.34,1.45,.5,1)}
.glegend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-weight:800;font-size:.72em;margin-top:2px}
.glegend span{padding:4px 2px;border-radius:10px;border:2px solid transparent;line-height:1.1}
.glegend span.on{border-color:var(--ink);background:#fff}
.react{display:flex;align-items:center;gap:10px;background:var(--sunL);border:2px solid var(--sun);border-radius:14px;padding:8px 12px;font-weight:700}
.react span{flex:1}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.three{grid-template-columns:1fr}}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:76px;padding:8px 6px;border-radius:16px;border:3px solid var(--acc);background:#fff;font-weight:900;line-height:1.1;font-size:.92em}
.rb svg{width:34px;height:34px}
@media(max-width:560px){.rb{flex-direction:row;justify-content:flex-start;text-align:left;padding:8px 14px}}
.rb.up{--acc:#b8453a}.rb.down{--acc:#3a7a50}.rb.var{--acc:#3d6fa3}
.rb:hover:not(:disabled){background:var(--accL,#fff6ee);transform:translateY(-2px)}
.rb:disabled{opacity:.55;cursor:default}
.rb.picked{opacity:1;background:var(--sunL);box-shadow:0 0 0 4px var(--acc)}
/* ---- Lösungen / Sag's anders ---- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;display:flex;gap:6px;align-items:stretch}
.ob{flex:1;text-align:left;display:flex;gap:10px;align-items:center;padding:10px 14px 10px 10px;border-radius:6px 16px 16px 6px;border:3px solid #8a6a4d;background:#fff6e6;font-weight:700;min-height:58px;position:relative}
.ob::before{content:"";width:12px;align-self:stretch;margin:-10px 0 -10px -10px;background:#8a6a4d;border-radius:3px;flex:none}
.ob .sg{width:26px;height:26px;flex:none;color:#8a6a4d}
.ob:hover{border-color:var(--teal)}
.ob[aria-pressed=true]{border-color:var(--teal);background:var(--tealL);box-shadow:0 0 0 3px rgba(47,106,114,.25)}
.ob .t{flex:1}
.ob .lab{display:flex;gap:6px;align-items:center;font-size:.85em;font-weight:900;margin-top:3px}
.ob .lab svg{width:22px;height:22px;flex:none}
.ob .why{display:block;font-weight:500;font-size:.88em;color:var(--ink2)}
.ob.r-gut{border-color:var(--green);background:var(--greenL)}.ob.r-gut .lab{color:var(--green)}
.ob.r-auch{border-color:var(--teal);background:var(--tealL)}.ob.r-auch .lab{color:var(--teal)}
.ob.r-hilfe{border-color:var(--blue);background:var(--blueL)}.ob.r-hilfe .lab{color:var(--blue)}
.ob.r-vorsicht{border-color:var(--terra);background:var(--terraL)}.ob.r-vorsicht .lab{color:#a34e22}
.ob.sel{box-shadow:0 0 0 4px var(--ink)}
.opt .spk{align-self:center}
.hint{color:var(--ink2);font-size:.9em;font-weight:600}
/* ---- Ende / Modal ---- */
.endbox{max-width:760px;margin:20px auto;text-align:center;background:var(--paper);border:3px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:26px 20px}
.endbox h1{font-size:clamp(1.9rem,5vw,3rem);color:var(--teal)}
.endbox p{font-size:1.15em;margin:10px 0}
.endbox .steps{margin:14px 0}
.endbox .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.modal{position:fixed;inset:0;background:rgba(61,47,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--paper);border-radius:24px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;border:3px solid var(--teal);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mbox h2{color:var(--teal);margin-bottom:8px}
.mbox ul{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px;margin:10px 0}
.mbox li{display:flex;gap:10px;align-items:flex-start}
.mbox li svg{width:40px;height:40px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:420px){#app{padding:8px 10px 30px}.gbar .step span.lbl{display:none}.gbar .step{padding:3px}.panel{padding:12px 12px 14px}}

.stepi{width:32px;height:32px;flex:none}
.zi{width:30px;height:30px;flex:none}
.mcard .txt{flex:1}
.glegend b{font-size:1.15em}.glegend span{font-size:.95em}
.zones{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.zone,.stm,.cardw,.placed{min-width:0}
.stm span,.zhead span{overflow-wrap:anywhere}
@media(min-width:1000px) and (max-width:1340px){.zones{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){.zones{grid-template-columns:minmax(0,1fr)}}
.ob.r-gut .lab{color:#2d6a43}.ob.r-hilfe .lab{color:#2a5888}.zone.guess{--acc:#a34e22}.zone.know{--acc:#2d6a43}
.fb .hl b{color:#2a5888}
.phase{border:3px solid var(--acc);border-radius:16px;padding:8px;background:var(--accL);display:flex;flex-direction:column;gap:8px}
.phase.know{--acc:#2d6a43;--accL:#e8f4ea}.phase.guess{--acc:#a34e22;--accL:#fbeee3}
.ph{display:flex;gap:10px;align-items:flex-start;color:var(--acc);font-weight:900;line-height:1.2}.ph small{display:block;color:var(--ink);font-weight:600;font-size:.88em;margin-top:2px}
.ph svg{width:32px;height:32px;flex:none}
.stm.selc{border-color:var(--green);background:var(--greenL);box-shadow:0 0 0 3px rgba(63,127,85,.3)}
.stm.dim{display:none}
.stm.guessed{border-color:var(--terra);background:var(--terraL)}
.stm:disabled{opacity:1;color:var(--ink)}
.phase.concl{--acc:#3a7a50;--accL:#eef6ee}.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.92em}
.sum>div{background:#fff;border-radius:12px;padding:6px 10px;border:2px solid var(--line)}.sum ul{margin:4px 0 0;padding-left:18px}
@media(max-width:560px){.sum{grid-template-columns:1fr}}

</style>
</head>

<main id="app">
<section id="start" class="screen" aria-label="Startbildschirm"></section>

</main>
<div id="modal" class="modal" hidden></div>

<script>
/* ===== Figurensystem „Gefühlsdetektive“ – rein SVG, modular ===== */
const GDLIB=(function(){
'use strict';
const CX=120, CY=96, SY=158, NY=148, HEM=252, VW=240, VH=280;
const OUT='#5a4033', OW=2.3;
const UL=44, FL=40;

const SKIN=[null,
 {b:'#fbdcc4',s:'#eeb89a'},{b:'#f4c7a1',s:'#e3a47c'},{b:'#e8b186',s:'#d3926a'},{b:'#d89b6c',s:'#bf7c52'},
 {b:'#bd7d4f',s:'#a2623a'},{b:'#9a5f3a',s:'#814b2b'},{b:'#764226',s:'#5f321b'},{b:'#573019',s:'#442310'}];

const HEADS={
 round:{hw:33,hh:35,jaw:21,ck:.14},
 oval:{hw:29,hh:38,jaw:16,ck:.08},
 wide:{hw:36,hh:33,jaw:25,ck:.2},
 heart:{hw:33,hh:36,jaw:9,ck:-.02},
 square:{hw:32,hh:34,jaw:28,ck:.3},
 egg:{hw:31,hh:37,jaw:19,ck:.12}
};
const BUILDS={
 small:{sw:44,aw:14.5,hip:39,k:.93},
 slim:{sw:46,aw:15.5,hip:40,k:.98},
 normal:{sw:50,aw:17,hip:45,k:1},
 sturdy:{sw:55,aw:19,hip:51,k:1.04}
};

const r1=n=>Math.round(n*10)/10;
function rng(seed){let s=(seed*7919+13)%233280;return ()=>{s=(s*9301+49297)%233280;return s/233280;};}
function shade(h,a){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=a<0?0:255,p=Math.abs(a);
 r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
const ST=(w=OW)=>`stroke="${OUT}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

/* ---------- Kopf ---------- */
function headPath(H){const {cx,cy,hw,hh,jaw,ck}=H,top=cy-hh,chin=cy+hh;
 return `M${cx},${top} C${cx+hw*.62},${top} ${cx+hw},${cy-hh*.38} ${cx+hw},${r1(cy+hh*ck)} C${cx+hw},${r1(cy+hh*.72)} ${cx+jaw},${chin} ${cx},${chin} C${cx-jaw},${chin} ${cx-hw},${r1(cy+hh*.72)} ${cx-hw},${r1(cy+hh*ck)} C${cx-hw},${cy-hh*.38} ${cx-hw*.62},${top} ${cx},${top}Z`;}

/* ---------- Haare ---------- */
function capPath(H,o={}){const {cx,cy,hw,hh}=H,top=cy-hh;
 const ot=top-(o.vol??5),so=o.side??2,ty=cy+(o.temple??-2),hl=cy-hh*(o.hl??.5),sw=o.sweep??0,hlc=o.hlc??0,low=o.low??0;

function eyeSvg(x,y,side,E,F,id,skin){

 if(E.closed==='down') return `<path d="M${r1(x-7.5*s)},${r1(y-1.5)} Q${r1(x)},${r1(y+5.5)} ${r1(x+7.5*s)},${r1(y-1.5)}" fill="none" ${ST(2.8)}/>`+
   `<path d="M${r1(x+side*7.5*s)},${r1(y-1.5)} l${side*3},-1.6" ${ST(1.8)}/>`;
 const gx=E.gx||0,gy=E.gy||0,lid=E.lid||0,sl=E.slant||0;
 let rx,ry,body='';
 if(F.eyeStyle==='dot'){
  rx=5*s;ry=6.3*s*open;
  body=`<clipPath id="${id}"><ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${rx}" ry="${r1(ry)}"/></clipPath>
  <ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${rx}" ry="${r1(ry)}" fill="#fff"/>
  <g clip-path="url(#${id})"><ellipse cx="${r1(x+gx*1.7)}" cy="${r1(y+gy*2)}" rx="${r1(4.1*s*(E.pupil||1))}" ry="${r1(Math.max(5.2*s*(E.pupil||1),1))}" fill="#33231c"/><circle cx="${r1(x+gx*1.7-1.3)}" cy="${r1(y+gy*2-2)}" r="1.5" fill="#fff"/>${lidCover(x,y,rx,ry,lid,sl,side,skin)}</g>
  <ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${rx}" ry="${r1(ry)}" fill="none" ${ST(1.5)}/>`;
 } else {
  rx=7.2*s;ry=8.2*s*open;const ir=5.1*s;
  const ix=x+gx*(rx-ir*.62),iy=y+gy*Math.min(ry*.45,3.4);
  body=`<clipPath id="${id}"><ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(rx)}" ry="${r1(ry)}"/></clipPath>
  <ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="#fff"/>
  <g clip-path="url(#${id})"><circle cx="${r1(ix)}" cy="${r1(iy)}" r="${r1(ir*(E.pupil>0&&E.pupil<1?1:1))}" fill="${F.iris||'#6a4a32'}"/><circle cx="${r1(ix)}" cy="${r1(iy)}" r="${r1(2.5*(E.pupil||1)+.4)}" fill="#2b1d17"/><circle cx="${r1(ix-1.7)}" cy="${r1(iy-2)}" r="1.5" fill="#fff"/>${E.sparkle?`<circle cx="${r1(ix+2)}" cy="${r1(iy+1.8)}" r=".9" fill="#fff"/>`:''}${lidCover(x,y,rx,ry,lid,sl,side,skin)}</g>
  <ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="none" ${ST(1.5)}/>`;
 }
 // Oberlid-Linie
 const yb=y-ry+lid*2*ry;
 const yl=side<0?yb-sl:yb+sl, yr=side<0?yb+sl:yb-sl;

  ? `<path d="M${r1(x-rx-.5)},${r1(yl)} L${r1(x+rx+.5)},${r1(yr)}" fill="none" ${ST(2.7)}/>`
  : `<path d="M${r1(x-rx-.8)},${r1(y+.5)} Q${r1(x)},${r1(y-ry*1.38)} ${r1(x+rx+.8)},${r1(y+.5)}" fill="none" ${ST(2.6)}/>`;

function lidCover(x,y,rx,ry,lid,sl,side,skin){

 if(bend==='out') k=Math.abs(c[0][0]-CX)>=Math.abs(c[1][0]-CX)?0:1;
 else if(bend==='in') k=Math.abs(c[0][0]-CX)<=Math.abs(c[1][0]-CX)?0:1;
 else if(bend==='up') k=c[0][1]<=c[1][1]?0:1;

}

 const c=Math.cos(lean),s=Math.sin(lean);const rx=x*c-y*s,ry=x*s+y*c;
 return [rx+120,ry+L.VH+(R.dy||0)];}

 });
 out+=figs;
 (def.front||[]).forEach(p=>{out+=prop(p.k,p.x,p.y,p.s||1,p.r||0);});

/* ---------- Start ---------- */
function show(id){['start','game','end'].forEach(s=>{$('#'+s).hidden=s!==id;});stopSay();window.scrollTo(0,0);}
function setSound(on){S.sound=on;document.body.classList.toggle('mute',!on);document.querySelectorAll('[data-act=snd]').forEach(b=>{b.innerHTML=(on?ICO.spk:ICO.mute)+'<span class="sr">Ton</span>';b.setAttribute('aria-pressed',String(!on));b.setAttribute('aria-label',on?'Vorlesen ist an':'Vorlesen ist aus');});if(!on)stopSay();}
function topline(home){return `<div class="topline">${home?`<button type="button" class="iconbtn" data-act="home" aria-label="Zur Startseite">${ICO.home}<span>Start</span></button>`:''}<button type="button" class="iconbtn" id="sndBtn" data-act="snd"></button><button type="button" class="iconbtn" data-act="info" aria-label="Kurz erklärt">${ICO.info}<span>Kurz erklärt</span></button></div>`;}
function buildStart(){
 const cards=ORDER.map(k=>{const A=AREAS[k];const c=CASES[k].find(x=>x.id===A.demo);const it=inst(c);const sc=L.scene(it.def);
  return `<button type="button" class="mcard a-${k}" data-area="${k}"><span class="art" style="background:${sc.top}">${sc.svg.replace(' role="img"','').replace(/aria-label="[^"]*"/,'aria-hidden="true"')}</span><span class="txt"><span class="nm">${STEPICO[A.step].replace('<svg','<svg class="stepi"')}${A.name}</span><span class="ds">${A.desc}</span><span class="go">${ICO.play}Los geht’s</span></span></button>`;}).join('');
 $('#start').innerHTML=topline(false)+`<div class="hero"><h1>${STEPICO.stopp.replace('<svg','<svg class="ico"')}Streit-Stopp</h1><p class="sub">Konflikte erkennen &amp; Lösungen finden</p><p class="intro">Streit passiert. Entscheidend ist, was wir daraus machen. ${spk('Streit-Stopp. Konflikte erkennen und Lösungen finden. Streit passiert. Entscheidend ist, was wir daraus machen.')}</p></div>${stepBar(null,false)}<div class="cards">${cards}</div><div class="startfoot"><button type="button" class="bigbtn alt" data-act="info">${ICO.info}Kurz erklärt</button></div>`;

}
function modal(html){const m=$('#modal');m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="Kurz erklärt">${html}<div class="actions"><button type="button" class="bigbtn" data-act="closeModal">Verstanden</button></div></div>`;m.hidden=false;m.querySelector('button.bigbtn').focus();}
function closeModal(){$('#modal').hidden=true;}
function showInfo(){
 const t='Im Spiel übst du vier Dinge. Beim Streit-Check findest du heraus, was wir wirklich wissen und was wir nur vermuten. Beim Streit-Regler siehst du, was einen Streit größer oder kleiner macht. Beim Lösungsfinder suchst du Wege, die helfen können. Bei Sag’s anders findest du klare Sätze. Es gibt keine Punkte und keine Zeit. Hilfe holen ist kein Petzen.';
 modal(`<h2>Kurz erklärt ${spk(t)}</h2><p>Streit ist normal. Wichtig ist: <b>Was könnte jetzt helfen?</b> Nicht: Wer ist schuld?</p><ul>${STEPS.map(s=>`<li>${STEPICO[s[0]]}<span><b>${s[1]}</b><br>${s[2]}</span></li>`).join('')}</ul><p>Es gibt keine Punkte und keine Zeit. Oft gibt es mehr als einen guten Weg. Wenn jemand wehtut, nicht aufhört oder du dich bedroht fühlst: <b>Hol dir Unterstützung. Das ist kein Petzen.</b></p>`);
}

/* ---------- Runde ---------- */
function startRound(area){
 S.area=area;S.i=0;S.done=0;S.tasks=pickCases(area).map(inst);
 buildGame();renderTask();show('game');

function buildGame(){

 $('#game').innerHTML=`<div class="gbar"><button type="button" class="iconbtn" data-act="home" aria-label="Zur Startseite">${ICO.home}<span>Start</span></button>${stepBar(A.step,false)}<div class="prog"><span id="progT"></span><div class="dots" id="dots" aria-hidden="true"></div></div><button type="button" class="iconbtn" id="sndBtn" data-act="snd"></button><button type="button" class="iconbtn" data-act="info" aria-label="Kurz erklärt">${ICO.info}</button></div><div class="stage a-${S.area}" id="stage"></div>`;

}
function updateProg(){

 $('#dots').innerHTML=S.tasks.map((_,i)=>`<i class="${i<S.done?'d':i===S.i?'c':''}"></i>`).join('');
}
function renderTask(){
 stopSay();S.locked=false;S.cur={};S.tk=(S.tk||0)+1;
 const it=S.tasks[S.i];updateProg();
 ({check:rCheck,regler:rRegler,loesung:rLoesung,sag:rSag})[S.area](it);
}
function nextTask(){S.done=S.i+1;S.i++;if(S.i>=ROUND){updateProg();showEnd();}else{renderTask();window.scrollTo({top:0,behavior:'auto'});}}
function showEnd(){

 $('#end').innerHTML=topline(true)+`<div class="endbox"><h1>Streit-Stopp geschafft!</h1><p>Du hast verschiedene Wege kennengelernt, mit Streit umzugehen. ${spk('Streit-Stopp geschafft! Du hast verschiedene Wege kennengelernt, mit Streit umzugehen.')}</p>${stepBar(null,false)}<p class="hint">Bereich: ${A.name}</p><div class="btns"><button type="button" class="bigbtn" data-act="again">${ICO.redo}Noch eine Runde</button><button type="button" class="bigbtn alt" data-act="areas">${ICO.grid}Anderen Bereich wählen</button><button type="button" class="bigbtn alt" data-act="home">${ICO.home}Zur Startseite</button></div></div>`;
 setSound(S.sound);show('end');$('#end .bigbtn').focus();
}
const stage=()=>$('#stage');
function panelHead(it,q,bubs){const sp=spokenScene(it,bubs);return `<div class="situ">${spk(sp+' '+q)}<span>${esc(it.sit)}</span></div><h2 class="q">${esc(q)}</h2>`;}
function setFb(html){const f=$('#fb');f.innerHTML=html;}
function finish(label){S.locked=true;const a=$('#actions');a.innerHTML=`<button type="button" class="bigbtn" id="nextBtn" data-act="next">${S.i===ROUND-1?'Fertig':label||'Weiter'}${ICO.next}</button>`;$('#nextBtn').focus({preventScroll:false});}

/* ---------- 1 STREIT-CHECK (zwei getrennte Schritte) ---------- */
function rCheck(it){
 const stm=shuffle(it.c.stm.map((s,i)=>({id:i,t:it.sub(s.t),know:!!s.know,sel:false,seen:false,
  why:s.know?'Das haben wir gesehen oder gehört. Das ist sicher.':'Das denken wir uns nur („bestimmt“, „vielleicht“). Sicher wissen wir es nicht.'})));
 S.cur={stm,phase:1,revealed:false,pick:null,ops:shuffle([{k:'ask'},{k:'look'},{k:'acc'}])};
 const sc=sceneHTML(it);S.cur.bubs=sc.bubs;
 stage().innerHTML=sc.html+`<div class="panel">${panelHead(it,AREAS.check.q,sc.bubs)}<div class="work" id="work"></div><div class="fb" id="fb" aria-live="polite"></div><div class="actions" id="actions"></div></div>`;
 drawCheck(it);
}
function chkCard(c,mode,extra){
 let cls='stm',mk='',why='',dis='';
 if(mode==='pick'){cls+=c.sel?' selc':'';}
 else if(mode==='know'){cls+=c.know?' ok':' dim';mk=c.know?MK.weiss:'';why=c.know?`<span class="why">${esc(c.why)}</span>`:'';dis='disabled';}
 else if(mode==='guess'){cls+=c.seen?' guessed':'';mk=c.seen?MK.umleg:'';why=c.seen?`<span class="why">${esc(c.why)}</span>`:'';}
 return `<div class="cardw"><button type="button" class="${cls}" data-card="${c.id}" ${mode==='pick'?`aria-pressed="${c.sel}"`:''} ${dis}>${mk}<span>${esc(c.t)}${why}</span></button>${spk(c.t,true)}</div>`;
}
function drawCheck(it){
 const C=S.cur,stm=C.stm,w=$('#work'),act=$('#actions');
 if(C.phase===1&&!C.revealed){
  w.innerHTML=`<div class="phase know"><div class="ph">${STEPICO.schau.replace('<svg','<svg class="zi"')}<span><b>Schritt 1 von 3: DAS WISSEN WIR</b><small>Tippe alle Sätze an, die wir gesehen oder gehört haben. Das ist sicher.</small></span></div><div class="pool">${stm.map(c=>chkCard(c,'pick')).join('')}</div></div>`;
  act.innerHTML=`<button type="button" class="bigbtn" data-act="checkIt" ${stm.some(c=>c.sel)?'':'disabled'}>Prüfen</button>`;
 }else if(C.phase===1){
  w.innerHTML=`<div class="phase know"><div class="ph">${STEPICO.schau.replace('<svg','<svg class="zi"')}<span><b>DAS WISSEN WIR</b><small>Das ist sicher.</small></span></div><div class="pool">${stm.filter(c=>c.know).map(c=>chkCard(c,'know')).join('')}</div></div>`;
  act.innerHTML=`<button type="button" class="bigbtn" data-act="checkNext">Weiter: Was vermuten wir?${ICO.next}</button>`;
 }else{
  if(C.phase===3){drawAsk(it);return;}
  const g=stm.filter(c=>!c.know),all=g.every(c=>c.seen);
  w.innerHTML=`<div class="phase know ok"><div class="ph">${MK.weiss}<span><b>DAS WISSEN WIR</b><small>${stm.filter(c=>c.know).map(c=>esc(c.t)).join(' · ')}</small></span></div></div><div class="phase guess"><div class="ph">${QMARK}<span><b>Schritt 2 von 3: DAS VERMUTEN WIR</b><small>Das denken wir uns nur. Sicher wissen wir es nicht. Tippe jeden Satz an.</small></span></div><div class="pool">${g.map(c=>chkCard(c,'guess')).join('')}</div></div>`;
  act.innerHTML=all?`<button type="button" class="bigbtn" id="nextBtn" data-act="checkAsk">Weiter: Und jetzt?${ICO.next}</button>`:'';
 }
}
const QMARK=svgI('<circle cx="12" cy="12" r="10.5" fill="#fbeee3" stroke="#a34e22" stroke-width="1.8"/><path d="M8.7 9.2a3.4 3.4 0 116 2c-1.2.8-2.7 1.4-2.7 3.2" fill="none" stroke="#a34e22" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.8" r="1.5" fill="#a34e22"/>','0 0 24 24','zi');
function checkIt(it){
 const C=S.cur;C.revealed=true;
 const wrong=C.stm.filter(c=>c.sel!==c.know).length;
 setFb(wrong===0?'<b>Genau hingeschaut!</b>Das ist alles sicher: Wir haben es gesehen oder gehört.':'<b>So sieht es aus.</b>Hier sind alle sicheren Sätze. Bei den anderen wissen wir es nicht genau. Die kommen jetzt dran.');
 drawCheck(it);
}
function drawAsk(it){
 const C=S.cur,n=it.c.next,who=it.nm[n.who],pick=C.pick;
 const opt={ask:{t:`Ich frage: „${it.sub(n.ask)}“`,v:'gut',why:'Eine Frage hilft, herauszufinden, was wirklich war. Niemand wird beschuldigt.'},
  look:{t:'Ich schaue genau hin und frage jemanden, der es gesehen hat.',v:'auch',why:'Auch so finden wir mehr heraus, bevor wir etwas glauben.'},
  acc:{t:`Ich sage: „${it.sub(n.acc)}“`,v:'vorsicht',why:'Eine Vermutung wie ein Vorwurf zu sagen, kann den Streit noch größer machen.'}};
 C.opt=opt;
 const know=C.stm.filter(c=>c.know).map(c=>`<li>${esc(c.t)}</li>`).join(''),guess=C.stm.filter(c=>!c.know).map(c=>`<li>${esc(c.t)}</li>`).join('');
 $('#work').innerHTML=`<div class="phase concl"><div class="ph">${STEPICO.loesung.replace('<svg','<svg class="zi"')}<span><b>Schritt 3 von 3: UND JETZT?</b><small>${esc(who)} denkt etwas, das noch nicht sicher ist. Was könnte jetzt helfen?</small></span></div><div class="sum"><div><b>Das wissen wir:</b><ul>${know}</ul></div><div><b>Das wissen wir noch nicht:</b><ul>${guess}</ul></div></div><div class="opts">${C.ops.map(o=>`<div class="opt"><button type="button" class="ob${pick===o.k?' r-'+opt[o.k].v+' sel':''}" data-ca="${o.k}" aria-pressed="${pick===o.k}"><span class="t" style="display:flex;gap:10px;align-items:center">${SG}<span>${esc(opt[o.k].t)}</span></span></button>${spk(opt[o.k].t,true)}</div>`).join('')}</div></div>`;
 $('#actions').innerHTML=pick?`<button type="button" class="bigbtn" id="nextBtn" data-act="next">${S.i===ROUND-1?'Fertig':'Weiter'}${ICO.next}</button>`:'';
}
function checkAsk(it){S.cur.phase=3;setFb('');drawAsk(it);}
function pickAsk(k,it){const C=S.cur;C.pick=k;drawAsk(it);const o=C.opt[k];
 setFb(`<b>${MKLAB[o.v]}</b>${esc(o.why)}<div class="hl">${MK.weiss}<span><b>Merke:</b> Erst sicher wissen, dann entscheiden. Was wir nur vermuten, können wir nachfragen.</span></div>`);
 const b=document.querySelector(`[data-ca="${k}"]`);if(b)b.focus();}
function checkNext(it){const C=S.cur;C.phase=2;setFb('');drawCheck(it);const f=document.querySelector('.phase.guess .stm');if(f)f.focus();}
function onCheckClick(t,it){
 const cd=t.closest('[data-card]');if(!cd||S.locked)return false;
 const C=S.cur,c=C.stm.find(x=>x.id===+cd.dataset.card);
 if(C.phase===1&&!C.revealed){c.sel=!c.sel;drawCheck(it);const n=document.querySelector(`[data-card="${c.id}"]`);if(n)n.focus();return true;}
 if(C.phase===2&&!c.know){c.seen=true;drawCheck(it);const n=document.querySelector(`[data-card="${c.id}"]`);if(n)n.focus();
  if(C.stm.filter(x=>!x.know).every(x=>x.seen)){setFb('<b>Das sind Vermutungen.</b>Vielleicht stimmen sie, vielleicht nicht. Und jetzt: Was tun wir damit?');const nb=$('#nextBtn');if(nb)nb.focus();}
  return true;}
 return false;
}

/* ---------- 2 STREIT-REGLER ---------- */
const LV=['ruhig','angespannt','Streit','eskaliert'];
const LVCOL=['#6aa57a','#e9b949','#e08a4e','#b8453a'];
function gaugeSVG(){
 const cx=150,cy=150,R=130,r=80;let seg='';
 for(let i=0;i<4;i++){const a0=(180+i*45)*Math.PI/180,a1=(180+(i+1)*45)*Math.PI/180;const p=(a,rr)=>`${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`;
  seg+=`<path d="M${p(a0,R)} A${R},${R} 0 0 1 ${p(a1,R)} L${p(a1,r)} A${r},${r} 0 0 0 ${p(a0,r)}Z" fill="${LVCOL[i]}" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>`;
  const am=(180+i*45+22.5)*Math.PI/180;seg+=`<text x="${(cx+105*Math.cos(am)).toFixed(1)}" y="${(cy+105*Math.sin(am)+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="900" fill="#3d2f28">${i+1}</text>`;}
 return `<svg viewBox="0 0 300 175" role="img" aria-label="Streit-Regler mit vier Stufen: ruhig, angespannt, Streit, eskaliert"><path d="M10 150 A140 140 0 0 1 290 150" fill="none"/>${seg}<g class="needle" id="needle" style="transform:rotate(${angle(0)}deg)"><path d="M146,150 L150,34 L154,150Z" fill="#3d2f28" stroke="${O}" stroke-width="1.5" stroke-linejoin="round"/></g><circle cx="150" cy="150" r="13" fill="#fffaf0" stroke="${O}" stroke-width="4"/></svg>`;
}
const angle=lv=>-67.5+lv*45;
function setNeedle(lv){const n=$('#needle');if(n)n.style.transform=`rotate(${angle(lv)}deg)`;}
function legend(lv){return LV.map((n,i)=>`<span class="${i===lv?'on':''}"><b>${i+1}</b><br>${n}</span>`).join('');}
const AR={
 up:svgI('<path d="M12 4l8 9h-5v7H9v-7H4z" fill="currentColor"/>','0 0 24 24'),
 down:svgI('<path d="M12 20l-8-9h5V4h6v7h5z" fill="currentColor"/>','0 0 24 24'),
 var:svgI('<path d="M3 12l5-5v3.5h8V7l5 5-5 5v-3.5H8V17z" fill="currentColor"/>','0 0 24 24')
};
function rRegler(it){
 const c=it.c;const hasThird=true;S.cur={lv:c.lvl};
 const react={f:c.react.f,t:it.sub(c.react.t),k:c.react.k==='act'?'act':c.react.k,cls:'mine'};
 const sc=sceneHTML(it,[Object.assign({},react,{cls:'react',replace:false})]);
 const rt=it.sub(c.react.t);const who=it.nm[c.react.f===0?0:1];
 const rtxt=c.react.k==='act'?rt:`${CAST[it.kids[c.figs[c.react.f].r]].n}: „${rt}“`;
 stage().innerHTML=sc.html+`<div class="panel"><div class="situ">${spk(it.sit+' '+rtxt+' '+AREAS.regler.q)}<span>${esc(it.sit)}</span></div><div class="react"><span>${esc(rtxt)}</span></div><h2 class="q">${AREAS.regler.q}</h2><div class="gauge" id="gauge">${gaugeSVG()}<div class="glegend" id="glegend">${legend(c.lvl)}</div></div><div class="work three" id="work"><button type="button" class="rb up" data-r="up">${AR.up}<span>STREIT WIRD GRÖSSER</span></button><button type="button" class="rb down" data-r="down">${AR.down}<span>STREIT WIRD KLEINER / RUHIGER</span></button><button type="button" class="rb var" data-r="var">${AR.var}<span>KANN UNTERSCHIEDLICH SEIN</span></button></div><div class="fb" id="fb" aria-live="polite"></div><div class="actions" id="actions"></div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>setNeedle(c.lvl)));
}
function answerRegler(r,it){
 if(S.locked)return;S.locked=true;const c=it.c;
 document.querySelectorAll('.rb').forEach(b=>{b.disabled=true;if(b.dataset.r===r)b.classList.add('picked');});
 let end=c.lvl;if(c.out==='up')end=Math.min(3,c.lvl+1);else if(c.out==='down')end=Math.max(0,c.lvl-1);
 const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 const lg=n=>{const g=$('#glegend');if(g)g.innerHTML=legend(n);};
 const tk=S.tk;const later=(f,ms)=>setTimeout(()=>{if(S.tk===tk)f();},ms);
 if(c.out==='var'){const lo=Math.max(0,c.lvl-1),hi=Math.min(3,c.lvl+1);setNeedle(lo);later(()=>setNeedle(hi),reduce?0:900);later(()=>{setNeedle(c.lvl);lg(c.lvl);},reduce?0:1800);}
 else{setNeedle(end);lg(end);}
 const head={up:'Das könnte den Streit noch größer machen.',down:'Das könnte den Streit kleiner und ruhiger machen.',var:'Das kann unterschiedlich sein.'}[c.out];
 const pre=r===c.out?'Gut erkannt! ':'Wir sehen es hier etwas anders. ';
 setFb(`<b>${pre}${head}</b>${esc(it.sub(c.why))}`);
 finish();
}

/* ---------- 3 LÖSUNGSFINDER ---------- */
function rLoesung(it){
 const opts=shuffle(it.c.opts.map((o,i)=>({id:i,t:it.sub(o.t),v:o.v,why:it.sub(o.why),sel:false})));
 S.cur={opts};const sc=sceneHTML(it);S.cur.bubs=sc.bubs;
 stage().innerHTML=sc.html+`<div class="panel">${panelHead(it,AREAS.loesung.q,sc.bubs)}<div class="work opts" id="work"></div><div class="fb" id="fb" aria-live="polite"></div><div class="actions" id="actions"></div></div>`;
 drawLoesung(it);
}
function drawLoesung(it){
 const done=S.locked,{opts}=S.cur;
 $('#work').innerHTML=(done?'':'<p class="hint">Tippe auf die Wegweiser, die dir passend erscheinen.</p>')+opts.map(o=>{
  const r=done?` r-${o.v}${o.sel?' sel':''}`:'';
  const lab=done?`<span class="lab">${MK[o.v]}${MKLAB[o.v]}${o.sel?' (deine Wahl)':''}</span><span class="why">${esc(o.why)}</span>`:'';
  return `<div class="opt"><button type="button" class="ob${r}" data-o="${o.id}" aria-pressed="${o.sel}" ${done?'disabled':''}>${SG}<span class="t">${esc(o.t)}${lab}</span></button>${spk(o.t,true)}</div>`;}).join('');
 if(!done)$('#actions').innerHTML=`<button type="button" class="bigbtn" data-act="lsg" ${opts.some(o=>o.sel)?'':'disabled'}>So probiere ich es</button>`;
}
function doLoesung(it){
 const {opts}=S.cur;S.locked=true;drawLoesung(it);
 const good=opts.filter(o=>o.v!=='vorsicht').length;const sel=opts.filter(o=>o.sel);
 const onlyRisky=sel.every(o=>o.v==='vorsicht');
 let m=[];
 if(onlyRisky)m.push('<b>Schau dir auch die anderen Wege an.</b>Manche könnten besser helfen.');
 else m.push(good>1?'<b>Hier gibt es mehr als eine gute Möglichkeit.</b>Was passt, hängt auch davon ab, was du dir zutraust und wie die Situation ist.':'<b>Das könnte helfen.</b>');
 if(it.c.needHelp)m.push('<div class="hl">'+MK.hilfe+'<span><b>Hier musst du das nicht alleine lösen.</b>Hol dir Unterstützung. Das ist kein Petzen.</span></div>');
 else if(opts.some(o=>o.v==='hilfe'))m.push('<div class="hl">'+MK.hilfe+'<span>Hilfe holen ist kein Petzen. Es ist eine gute Möglichkeit, wenn es allein nicht klappt.</span></div>');
 setFb(m.join(''));finish();
}

/* ---------- 4 SAG'S ANDERS ---------- */
function rSag(it){
 const opts=shuffle(it.c.opts.map((o,i)=>({id:i,t:it.sub(o.t),v:o.v,why:it.sub(o.why)})));
 S.cur={opts,pick:null,tried:0};
 const first=(it.c.bub||[]).find(b=>b.f===it.c.who);
 const sc=sceneHTML(it);S.cur.bubs=sc.bubs;
 const lead=first?`Das wurde gesagt: „${it.sub(first.t)}“`:'';
 stage().innerHTML=sc.html+`<div class="panel">${panelHead(it,AREAS.sag.q,sc.bubs)}<div class="work opts" id="work"></div><div class="fb" id="fb" aria-live="polite"></div><div class="actions" id="actions"></div></div>`;
 drawSag(it);
}
function drawSag(it){
 const {opts,pick}=S.cur;
 $('#work').innerHTML=`<p class="hint">${pick===null?'Tippe einen Satz an. Er erscheint dann in der Sprechblase.':'Du kannst auch andere Sätze ausprobieren.'}</p>`+opts.map(o=>`<div class="opt"><button type="button" class="ob${pick===o.id?' r-'+o.v+' sel':''}" data-s="${o.id}" aria-pressed="${pick===o.id}"><span class="t">${SG}<span>${esc(o.t)}</span></span></button>${spk(o.t,true)}</div>`.replace('<span class="t">'+SG,'<span class="t" style="display:flex;gap:10px;align-items:center">'+SG)).join('');
}
function pickSag(id,it){
 const o=S.cur.opts.find(x=>x.id===id);S.cur.pick=id;S.cur.tried++;
 const row=$('#bubrow'),n=it.def.figs.length;const who=it.c.who;
 const cls=o.v==='gut'?'':o.v==='auch'?'alt':'warn';
 const bubs=(it.c.bub||[]).filter(b=>b.f!==who).map(b=>({f:b.f,t:it.sub(b.t),k:b.k||'say'}));
 bubs.push({f:who,t:o.t,k:'say',cls:'mine '+cls});
 row.innerHTML=bubRow(n,bubs);
 drawSag(it);
 const head={gut:MKLAB.gut,auch:MKLAB.auch,vorsicht:MKLAB.vorsicht}[o.v];
 const hint=it.c.id==='s12'||it.c.id==='s14'?'<div class="hl">'+MK.hilfe+'<span><b>Hier musst du das nicht alleine lösen.</b>Hol dir Unterstützung. Das ist kein Petzen.</span></div>':'';
 setFb(`<b>${head}</b>${esc(o.why)}${hint}`);
 if(S.cur.tried===1)finish();
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
 const t=e.target;
 const sp=t.closest('.spk');if(sp){say(sp.dataset.say);return;}
 const act=t.closest('[data-act]');
 const it=S.tasks[S.i];
 if(act){const a=act.dataset.act;
  if(a==='snd'){setSound(!S.sound);return;}
  if(a==='info'){showInfo();return;}
  if(a==='closeModal'){closeModal();return;}
  if(a==='home'){buildStart();show('start');return;}
  if(a==='areas'){buildStart();show('start');return;}
  if(a==='again'){startRound(S.area);return;}
  if(a==='next'){nextTask();return;}
  if(a==='checkIt'){checkIt(it);return;}
  if(a==='checkNext'){checkNext(it);return;}
  if(a==='checkAsk'){checkAsk(it);return;}
  if(a==='lsg'){doLoesung(it);return;}}
 const ar=t.closest('[data-area]');if(ar){startRound(ar.dataset.area);return;}
 if(!it||$('#game').hidden)return;
 if(S.area==='check'){const ca=t.closest('[data-ca]');if(ca){pickAsk(ca.dataset.ca,it);return;}onCheckClick(t,it);return;}
 const rb=t.closest('[data-r]');if(rb&&S.area==='regler'){answerRegler(rb.dataset.r,it);return;}
 const ob=t.closest('[data-o]');if(ob&&S.area==='loesung'&&!S.locked){const o=S.cur.opts.find(x=>x.id===+ob.dataset.o);o.sel=!o.sel;drawLoesung(it);const nb=document.querySelector(`[data-o="${o.id}"]`);if(nb)nb.focus();return;}
 const sb=t.closest('[data-s]');if(sb&&S.area==='sag'){pickSag(+sb.dataset.s,it);const nb=document.querySelector(`[data-s="${sb.dataset.s}"]`);if(nb)nb.focus();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});
window.__ss={S,CASES,inst,startRound,buildStart,pickCases,AREAS,ROUND,renderTask,answerRegler,pickSag,doLoesung,checkIt,nextTask,sceneHTML};
buildStart();show('start');
})();

</script>
